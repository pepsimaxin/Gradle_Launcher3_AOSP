apply plugin: 'com.android.application'
apply plugin: 'com.google.protobuf'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'jacoco'

android {
    namespace = "com.android.launcher3"
    compileSdk 35

    defaultConfig {
        minSdkVersion 35

        versionCode 1
        versionName "1.0.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
            //zipAlignEnabled true
        }

        release {
            minifyEnabled false
            //zipAlignEnabled true
        }
    }

    // The flavor dimensions for build variants (e.g. aospWithQuickstep, aospWithoutQuickstep)
    // See: https://developer.android.com/studio/build/build-variants#flavor-dimensions
    flavorDimensions = ["app", "quickstep", "go"]

    productFlavors {
        aosp {
            dimension "app"
            applicationId 'com.android.launcher3'
            //testApplicationId 'com.android.launcher3.tests'
        }

        withQuickstep {
            dimension "quickstep"
            minSdkVersion 35
        }

        go {
            dimension "go"
            minSdkVersion 35
            versionName "1.0.0.0_GO"
        }

        withoutGo {
            dimension "go"
            minSdkVersion 35
            versionName "1.0.0.0"
        }
    }

    sourceSets {
        main {
            res.srcDirs = ['res', 'iconloaderlib/res', 'SystemUIAimationLib/res',]
            java.srcDirs = ['src', 'src_plugins',
                            'iconloaderlib/src', 'iconloaderlib/src_full_lib',
                            //'animationlib/src',
                            //'SystemUIAimationLib/src',
                            'viewcapturelib/src',
                    'tests/multivalentTests/shared'
            ]
            aidl.srcDirs = ['src', 'src_plugins',
                            'iconloaderlib/src', 'iconloaderlib/src_full_lib',
                            //'animationlib/src',
                            //'SystemUIAimationLib/src',
                            //'motiontoollib/src',
                            'viewcapturelib/src']
            manifest.srcFile 'AndroidManifest-common.xml'
            proto {
                srcDirs = ['protos/', 'quickstep/protos_overrides/',
                           'motiontoollib/src/com/android/app/motiontool/proto',
                           'viewcapturelib/src/com/android/app/viewcapture/proto']
            }
            assets.srcDirs = ['assets', 'assets/']
        }

        aosp {
            java.srcDirs = ['src_flags', 'src_shortcuts_overrides']
        }

        withQuickstep {
            res.srcDirs = ['quickstep/res']
            java.srcDirs = ['quickstep/src']
            manifest.srcFile 'quickstep/AndroidManifest.xml'
        }

        go {
            res.srcDirs = ['go/quickstep/res']
            java.srcDirs = ['go/quickstep/src']
            manifest.srcFile 'go/AndroidManifest.xml'
        }

        withoutGo {
            java.srcDirs = ['src_build_config/']
        }

        aospWithQuickstepGo {
            manifest.srcFile 'quickstep/AndroidManifest-launcher.xml'
        }

        aospWithQuickstepWithoutGo {
            manifest.srcFile 'quickstep/AndroidManifest-launcher.xml'
        }
    }
//    lintOptions {warning 'all'
//        warningsAsErrors false}
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    tasks.lint.enabled = false
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
    }

    kotlin {
        jvmToolchain(17)
    }
    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs = ["-Xjvm-default=all-compatibility"]
    }
}

